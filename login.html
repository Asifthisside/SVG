<style>
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glow-focus:focus {
            outline: none;
            border-bottom-color: #6366f1; /* Using Indigo #6366f1 as requested, mapping to primary visual token conceptually though theme uses primary/surface tokens */
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.1), 0 2px 4px -1px rgba(99, 102, 241, 0.06);
        }

        .ambient-glow {
            box-shadow: 0px 20px 40px rgba(99, 102, 241, 0.15);
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden font-body-md">
<!-- Subdued 3D Background Placeholder -->
<div class="absolute inset-0 z-0 opacity-40 mix-blend-screen pointer-events-none">

</div>
<!-- Navigation Shell suppressed due to transactional intent (Login) -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center relative z-10 px-margin-mobile md:px-margin-desktop py-12">
<!-- Login Card -->
<div class="glass-panel rounded-xl w-full max-w-md ambient-glow p-8 flex flex-col gap-8 relative overflow-hidden">
<!-- Branding Header -->
<div class="text-center">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-2">SVGenius</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Command Center Authentication</p>
</div>
<!-- Tabs -->
<div class="flex border-b border-outline-variant/50 relative">
<button class="flex-1 pb-4 text-center font-label-md text-label-md text-primary border-b-2 border-primary transition-colors focus:outline-none" id="tab-user" onclick="switchTab('user')">
                    User Login
                </button>
<button class="flex-1 pb-4 text-center font-label-md text-label-md text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors focus:outline-none" id="tab-admin" onclick="switchTab('admin')">
                    Admin Access
                </button>
</div>
<!-- Forms Container -->
<div class="relative">
<!-- User Form -->
<form class="flex flex-col gap-6 transition-opacity duration-300 opacity-100" id="form-user">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="user-email">Email or Username</label>
<input class="bg-surface-container-high text-on-surface border-0 border-b-2 border-outline-variant rounded-t glow-focus px-4 py-3 font-body-md transition-colors" id="user-email" placeholder="Enter your credentials" type="text"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="user-password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-inverse-primary transition-colors" href="#">Forgot?</a>
</div>
<input class="bg-surface-container-high text-on-surface border-0 border-b-2 border-outline-variant rounded-t glow-focus px-4 py-3 font-body-md transition-colors" id="user-password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-[#6366f1] hover:bg-inverse-primary text-white font-label-md text-label-md py-4 rounded transition-colors mt-2 flex justify-center items-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                        Secure Login
                    </button>
</form>
<!-- Admin Form (Hidden initially) -->
<form class="flex flex-col gap-6 transition-opacity duration-300 hidden absolute top-0 left-0 w-full" id="form-admin">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-secondary" for="admin-id">Admin ID</label>
<input class="bg-surface-container-high text-on-surface border-0 border-b-2 border-outline-variant rounded-t glow-focus focus:border-secondary px-4 py-3 font-body-md transition-colors" id="admin-id" placeholder="Admin identifier" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-secondary" for="admin-token">Security Token</label>
<input class="bg-surface-container-high text-on-surface border-0 border-b-2 border-outline-variant rounded-t glow-focus focus:border-secondary px-4 py-3 font-body-md transition-colors" id="admin-token" placeholder="Enter 2FA token" type="password"/>
</div>
<button class="w-full bg-surface-container-high border border-secondary text-secondary hover:bg-secondary hover:text-on-secondary font-label-md text-label-md py-4 rounded transition-all mt-2 flex justify-center items-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
                        Authorize Access
                    </button>
</form>
</div>
<!-- Footer / Social (Only visible on User tab typically, but keeping it simple here) -->
<div class="flex flex-col items-center gap-4 mt-4 transition-opacity duration-300" id="social-login">
<span class="font-label-md text-label-md text-on-surface-variant flex items-center w-full gap-4">
<div class="h-px bg-outline-variant flex-1"></div>
                    or continue with
                    <div class="h-px bg-outline-variant flex-1"></div>
</span>
<div class="flex gap-4 w-full">
<button class="flex-1 bg-surface-container-high border border-white/10 rounded py-3 flex justify-center items-center hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-on-surface">corporate_fare</span>
</button>
<button class="flex-1 bg-surface-container-high border border-white/10 rounded py-3 flex justify-center items-center hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-on-surface">key</span>
</button>
</div>
</div>

<!-- Footer Component from JSON -->
<footer class="bg-transparent text-on-surface-variant w-full py-8 flex flex-col md:flex-row justify-between items-center px-margin-desktop gap-4 relative z-10">
<div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">
            © 2024 SVGenius. All rights reserved.
        </div>
<div class="flex gap-6 font-label-md text-label-md">
<a class="text-on-surface-variant hover:text-secondary transition-colors cursor-pointer" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-secondary transition-colors cursor-pointer" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-secondary transition-colors cursor-pointer" href="#">Security</a>
<a class="text-on-surface-variant hover:text-secondary transition-colors cursor-pointer" href="#">Status</a>
</div>
</footer>
<script>
        function switchTab(tab) {
            const userTab = document.getElementById('tab-user');
            const adminTab = document.getElementById('tab-admin');
            const userForm = document.getElementById('form-user');
            const adminForm = document.getElementById('form-admin');
            const socialLogin = document.getElementById('social-login');

            if (tab === 'user') {
                // Style Tabs
                userTab.classList.replace('text-on-surface-variant', 'text-primary');
                userTab.classList.replace('border-transparent', 'border-primary');
                adminTab.classList.replace('text-primary', 'text-on-surface-variant');
                adminTab.classList.replace('border-primary', 'border-transparent');
                
                // Toggle Forms
                adminForm.classList.add('opacity-0');
                setTimeout(() => {
                    adminForm.classList.add('hidden');
                    userForm.classList.remove('hidden');
                    // small delay to allow display block to take effect before opacity
                    setTimeout(() => userForm.classList.remove('opacity-0'), 10);
                    socialLogin.classList.remove('opacity-0', 'pointer-events-none');
                }, 300);

            } else {
                // Style Tabs
                adminTab.classList.replace('text-on-surface-variant', 'text-primary');
                adminTab.classList.replace('border-transparent', 'border-primary');
                userTab.classList.replace('text-primary', 'text-on-surface-variant');
                userTab.classList.replace('border-primary', 'border-transparent');

                // Toggle Forms
                userForm.classList.add('opacity-0');
                socialLogin.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    userForm.classList.add('hidden');
                    adminForm.classList.remove('hidden');
                    setTimeout(() => adminForm.classList.remove('opacity-0'), 10);
                }, 300);
            }
        }
    </script>
</body></html>
