<script>
        document.querySelectorAll('nav a.border-l-4').forEach(link => {
            link.addEventListener('click', (e) => {
                if(e.currentTarget.getAttribute('href') === '#') e.preventDefault();
                document.querySelectorAll('nav a.border-l-4').forEach(l => {
                    l.className = 'flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-on-surface hover:bg-surface-bright transition-colors duration-200 active:scale-95 transition-transform border-l-4 border-transparent';
                });
                e.currentTarget.className = 'flex items-center gap-3 px-4 py-3 text-primary border-l-4 border-primary bg-primary/5 active:scale-95 transition-transform';
            });
        });
    </script>
    
    <script src="/svg-library.js"></script>
    <script>
        const grid = document.getElementById('svg-grid');
        const searchInput = document.getElementById('search-input');
        let currentSvgs = window.svgeniusLibrary || [];

        const paginationContainer = document.getElementById('pagination-container');
        let currentPage = 1;
        const itemsPerPage = 20;
        let filteredSvgs = currentSvgs;

        function renderGrid() {
            grid.innerHTML = '';
            if (filteredSvgs.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-on-surface-variant py-12">No SVGs found matching your search.</div>';
                paginationContainer.innerHTML = '';
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = filteredSvgs.slice(startIndex, endIndex);

            currentItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-panel backdrop-blur-[20px] rounded-lg border border-outline-variant/30 overflow-hidden group hover:border-primary/50 transition-all duration-300 flex flex-col';
                card.innerHTML = `
                    <div class="block h-40 bg-surface-container-lowest/50 flex items-center justify-center p-6 relative">
                        <div class="w-16 h-16 text-primary drop-shadow-[0_0_15px_rgba(192,193,255,0.2)] group-hover:scale-110 transition-transform duration-500">
                            ${item.svg}
                        </div>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between border-t border-outline-variant/30">
                        <div class="mb-4">
                            <h3 class="font-body-md text-body-md font-medium text-on-surface truncate">${item.title}</h3>
                            <p class="font-label-md text-[11px] text-on-surface-variant mt-1">by @${item.author}</p>
                        </div>
                        <div class="flex gap-2 w-full">
                            <button onclick="copyToClipboard('${item.id}')" class="flex-1 bg-surface-bright hover:bg-surface-container-highest border border-outline-variant/30 text-on-surface font-label-md text-[11px] py-1.5 rounded transition-colors flex items-center justify-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">content_copy</span> Copy
                            </button>
                            <button onclick="window.useSvg(\'${item.id}\')" class="flex-1 bg-primary/20 hover:bg-primary/40 border border-primary/50 text-primary font-label-md text-[11px] py-1.5 rounded transition-colors flex items-center justify-center gap-1 cursor-pointer"><span class="material-symbols-outlined text-[14px]">add_circle</span> Use</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            renderPagination();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            const totalPages = Math.ceil(filteredSvgs.length / itemsPerPage);
            if (totalPages <= 1) return;

            // Prev Button
            const prevBtn = document.createElement('button');
            prevBtn.className = `px-3 py-1.5 rounded font-label-md text-[13px] transition-colors border ${currentPage === 1 ? 'border-transparent text-on-surface-variant/50 cursor-not-allowed' : 'border-outline-variant/30 text-on-surface hover:bg-surface-bright'}`;
            prevBtn.innerText = 'Prev';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; renderGrid(); window.scrollTo(0, 0); } };
            paginationContainer.appendChild(prevBtn);

            // Page numbers
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                const btn = document.createElement('button');
                const isActive = i === currentPage;
                btn.className = `w-8 h-8 flex items-center justify-center rounded font-label-md text-[13px] transition-all border ${isActive ? 'bg-primary text-on-primary border-primary shadow-sm' : 'border-outline-variant/30 text-on-surface hover:bg-surface-bright'}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; renderGrid(); window.scrollTo(0, 0); };
                paginationContainer.appendChild(btn);
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.className = `px-3 py-1.5 rounded font-label-md text-[13px] transition-colors border ${currentPage === totalPages ? 'border-transparent text-on-surface-variant/50 cursor-not-allowed' : 'border-outline-variant/30 text-on-surface hover:bg-surface-bright'}`;
            nextBtn.innerText = 'Next';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; renderGrid(); window.scrollTo(0, 0); } };
            paginationContainer.appendChild(nextBtn);
        }

        
        window.useSvg = (id) => {
            const item = window.svgeniusLibrary.find(s => s.id === id);
            if (item) {
                localStorage.setItem('svgenius-load-target', JSON.stringify(item));
                window.location.href = '/share.html';
            }
        };

        window.copyToClipboard = (id) => {
            const item = window.svgeniusLibrary.find(s => s.id === id);
            if (item) {
                navigator.clipboard.writeText(item.svg).then(() => {
                    alert('SVG Copied to clipboard!');
                });
            }
        };

        // Initialize
        renderGrid();

        let currentCategory = 'all';

        function applyFilters() {
            const term = searchInput ? searchInput.value.toLowerCase() : '';
            
            filteredSvgs = window.svgeniusLibrary.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(term) || 
                                      item.tags.some(tag => tag.includes(term)) ||
                                      item.author.toLowerCase().includes(term);
                
                
                let matchesCategory = true;
                if (currentCategory === 'animated') {
                    matchesCategory = item.tags.includes('animated') || item.tags.includes('3d');
                } else if (currentCategory === 'static') {
                    matchesCategory = !item.tags.includes('animated') && !item.tags.includes('3d') && !item.tags.includes('community');
                } else if (currentCategory === 'community') {
                    matchesCategory = item.tags.includes('community');
                } else if (currentCategory === 'community-static') {
                    matchesCategory = item.tags.includes('community') && !item.tags.includes('animated') && !item.tags.includes('3d');
                } else if (currentCategory === 'community-animated') {
                    matchesCategory = item.tags.includes('community') && (item.tags.includes('animated') || item.tags.includes('3d'));
                }


                return matchesSearch && matchesCategory;
            });

            currentPage = 1;
            renderGrid();
        }

        // Search logic
        if (searchInput) {
            searchInput.addEventListener('input', applyFilters);
        }

        // Category logic
        const catButtons = document.querySelectorAll('.cat-btn');
        catButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Update active tab styling
                catButtons.forEach(b => {
                    b.className = 'cat-btn px-4 py-1.5 rounded text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors';
                });
                e.target.className = 'cat-btn px-4 py-1.5 rounded bg-surface-bright text-primary font-label-md text-label-md shadow-sm';
                
                currentCategory = e.target.getAttribute('data-cat');
                applyFilters();
            });
        });
    </script>

    <script src="/theme.js"></script>
    <script>
        // Fetch user profile from settings
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('svgenius-settings');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    if (settings.avatar) {
                        const profileImg = document.getElementById('dashboard-profile-img');
                        if (profileImg) {
                            profileImg.src = settings.avatar;
                        }
                    }
                } catch(e) {
                    console.error('Error parsing settings for avatar', e);
                }
            }
        });
    </script>
